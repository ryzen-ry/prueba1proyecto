<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{/Users/Disca/layoutDis :: html}"
      th:with="titulo='Mi Historial'">
<head>
    <style>
        .historial-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .historial-card {
            background: white;
            border-radius: 16px;
            border: 1.5px solid #B8D4F0;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .historial-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            text-align: left;
        }
        .historial-table th {
            padding: 12px 16px;
            border-bottom: 2px solid #E5E7EB;
            color: #1E2D4A;
            font-weight: 600;
        }
        .historial-table td {
            padding: 16px;
            border-bottom: 1px solid #E5E7EB;
            color: #4B5563;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-pendiente { background-color: #FEF3C7; color: #D97706; }
        .status-aceptada { background-color: #D1FAE5; color: #059669; }
        .status-cancelada { background-color: #FEE2E2; color: #DC2626; }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6B7280;
        }
    </style>
</head>
<body>
    <div th:fragment="content">
        <div class="historial-container">
            <div class="historial-card">
                <h1 class="rs-section-title" style="margin-bottom: 10px;">📋 Historial de Ayudas Recibidas</h1>
                <p style="text-align: center; color: #6B7280; margin-bottom: 30px;">Consulta las solicitudes de ayuda que has realizado y su estado actual.</p>
                
                <div id="loading" style="text-align: center; padding: 20px;">
                    <p>Cargando historial...</p>
                </div>
                
                <div id="emptyState" class="empty-state" style="display: none;">
                    <p style="font-size: 1.2rem; font-weight: 600; margin-bottom: 8px;">Aún no tienes solicitudes de ayuda</p>
                    <p>Cuando solicites asistencia, aparecerán registradas aquí.</p>
                </div>
                
                <table id="historialTable" class="historial-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Voluntario</th>
                            <th>Contacto Voluntario</th>
                        </tr>
                    </thead>
                    <tbody id="historialBody">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', async () => {
                const loading = document.getElementById('loading');
                const emptyState = document.getElementById('emptyState');
                const table = document.getElementById('historialTable');
                const body = document.getElementById('historialBody');

                try {
                    const response = await fetch('/api/ayuda/historial');
                    if (!response.ok) throw new Error('Error al cargar datos');
                    
                    const data = await response.json();
                    loading.style.display = 'none';
                    
                    if (data.length === 0) {
                        emptyState.style.display = 'block';
                    } else {
                        table.style.display = 'table';
                        body.innerHTML = data.map(item => {
                            const fecha = new Date(item.creadaEn).toLocaleString();
                            let statusClass = 'status-pendiente';
                            if (item.estado === 'ACEPTADA') statusClass = 'status-aceptada';
                            if (item.estado === 'CANCELADA') statusClass = 'status-cancelada';
                            
                            const voluntarioNombre = item.voluntario 
                                ? `${item.voluntario.nombres} ${item.voluntario.apellidos}` 
                                : '—';
                            const voluntarioEmail = item.voluntario 
                                ? item.voluntario.email 
                                : '—';

                            return `
                                <tr>
                                    <td>${fecha}</td>
                                    <td><span class="status-badge ${statusClass}">${item.estado}</span></td>
                                    <td><strong>${voluntarioNombre}</strong></td>
                                    <td>${voluntarioEmail}</td>
                                </tr>
                            `;
                        }).join('');
                    }
                } catch (error) {
                    loading.innerHTML = '<p style="color: #DC2626;">❌ Error al cargar el historial. Inténtalo de nuevo más tarde.</p>';
                }
            });
        </script>
    </div>
</body>
</html>
