spring.application.name=enjambre

# ========== SERVIDOR ==========
server.port=${PORT:8080}

# ========== BASE DE DATOS ==========
spring.jpa.database=mysql
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ⚠️ CORREGIDO: Agrega "jdbc:" al inicio y cambia el primer "mysql:" por "jdbc:mysql:"
spring.datasource.url=jdbc:${MYSQL_URL}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

# ========== CORREO ==========
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:countercito10@gmail.com}
spring.mail.password=${MAIL_PASSWORD:qblo sfdr lvab zdrd}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8


# ========== THYMELEAF ==========
spring.thymeleaf.cache=false

# ========== MULTIPART (CARGA DE ARCHIVOS) ==========
